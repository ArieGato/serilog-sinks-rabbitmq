name: Run tests

on:
  pull_request:
    branches:
      - master
  # Upload code coverage results when PRs are merged
  push:
    branches:
      - master

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start RabbitMQ services
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: pwsh
        run: |
          docker compose up --quiet-pull --wait --wait-timeout 120
          if ($LASTEXITCODE -eq 0) {
              Write-Host "RabbitMQ services successfully started"
          }
          else {
              Write-Host "docker compose up failed with exit code $LASTEXITCODE."
              Write-Host "$(docker compose logs)"
              exit $LASTEXITCODE
          }

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable NuGet packages
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: bash scripts/check-vulnerable-packages.sh

      - name: Check formatting
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: dotnet format --no-restore --verify-no-changes --severity warn || (echo "Run 'dotnet format' to fix issues" && exit 1)

      - name: Build solution [Release]
        run: dotnet build --no-restore -c Release

      - name: Build solution [Debug]
        run: dotnet build --no-restore -c Debug

      # net48 is skipped on Linux because Microsoft.Testing.Platform runs the
      # net48 test executable through Mono. Windows still tests net48 natively.
      - name: Test solution [Debug]
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          dotnet test --framework net8.0 --no-restore --no-build --max-parallel-test-modules 1 --coverage --coverage-output-format cobertura --results-directory out/.coverage
          dotnet test --framework net10.0 --no-restore --no-build --max-parallel-test-modules 1 --coverage --coverage-output-format cobertura --results-directory out/.coverage

      - name: Test solution [Debug/Windows]
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: dotnet test tests/Serilog.Sinks.RabbitMQ.Tests/Serilog.Sinks.RabbitMQ.Tests.csproj --no-restore --no-build --max-parallel-test-modules 1

      - name: Upload coverage reports to Codecov
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        uses: codecov/codecov-action@v7
        with:
          files: out/.coverage/*.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }} # required

  buildcheck:
    needs:
      - test
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Pass build check
        if: ${{ needs.test.result == 'success' }}
        run: exit 0
      - name: Fail build check
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
